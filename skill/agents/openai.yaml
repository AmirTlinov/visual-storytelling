interface:
  display_name: "Наглядные объяснения"
  short_description: "Схемы, интерактивные разборы и рисованные рассказы"
  default_prompt: "Используй $visual-explainer: выстрой объяснение от знакомой задачи к новым понятиям, покажи причину, действие и результат на тех же объектах. Согласуй операции со словами и проверь промежуточные кадры. Для рисованного рассказа используй выразительный русский мужской голос Higgs TTS 3 и тихую музыку."
policy:
  allow_implicit_invocation: true
