<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Колебательный LC-контур</title>
    <script type="module">
      import '@visual-storytelling/core/style.css';
    </script>
  </head>
  <body class="ve-standalone">
    <main id="ve-scene" class="ve-scene" data-paper="false">
      <object
        type="image/svg+xml"
        data="LC-oscillator.svg"
        aria-label="Колебательный LC-контур"
      ></object>
      <div data-player></div>
    </main>
    <script type="module">
      import { SmilPlayer } from '@visual-storytelling/core';
      const root = document.getElementById('ve-scene');
      window.galleryReady = SmilPlayer.mount(root, { duration: 8 }).ready;
    </script>
  </body>
</html>
