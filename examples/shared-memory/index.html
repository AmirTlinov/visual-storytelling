<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Память, CPU и GPU</title><script type="module">import '@visual-storytelling/core/style.css';</script></head><body class="ve-standalone"><main id="ve-scene" class="ve-scene"><style>
    #ve-scene .ms-heading { display: flex; align-items: baseline; justify-content: center; flex-wrap: wrap; gap: 8px 20px; }
    #ve-scene h3 { margin: 0; font-family: inherit; font-weight: 500; }
    #ve-scene .ms-figure { display: block; width: 100%; height: 434px; margin: 6px 0 0; }
    #ve-scene .ms-figure text { fill: var(--ve-ink); font-family: inherit; font-weight: 400; }
    #ve-scene .ms-line { fill: none; stroke: var(--ve-ink); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    #ve-scene .ms-box { fill: none; stroke: var(--ve-ink); stroke-width: 2; stroke-linejoin: round; }
    #ve-scene .ms-active { fill: var(--ve-wash); stroke: var(--ve-accent); }
    #ve-scene .ms-values text { fill:var(--ve-accent); }
    #ve-scene .ms-data[data-route=gpu] { stroke:var(--ve-orange); }
    #ve-scene .ms-data { stroke: var(--ve-blue); }
    #ve-scene .ms-command { stroke: var(--ve-purple); }
    #ve-scene .ms-caption { white-space: nowrap; }

#ve-scene .canvas text{font-size:21px}#ve-scene .canvas .text-small{font-size:16px}#ve-scene h1{margin-bottom:10px}#ve-scene [data-pass],#ve-scene [data-step]{font-size:15px;color:var(--ve-muted)}
</style>
  <div class="ms-heading">
    <h1>Память, CPU и GPU</h1>
    <span class="text-small tabular-nums" data-step>Шаг 1 из 8</span>
  </div>
  <svg class="canvas ms-figure" role="img" aria-labelledby="ms-title ms-desc"></svg>
  <div class="sr-only" data-detail aria-live="polite" aria-atomic="true"></div>
  <div data-player></div>
</main><script type="module" src="scene.js"></script></body></html>
