<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Как веса BERT собирают запрос</title>
    <style>
      main.ve-scene {
        max-width: 1100px !important;
      }
      object {
        display: block;
        width: 100%;
        aspect-ratio: 1100/1433;
      }
      [data-player] {
        margin-top: 16px;
      }
      @media (max-width: 650px) {
        object {
          aspect-ratio: 550/1918;
        }
      }
    </style>
  </head>
  <body class="ve-standalone">
    <main id="ve-scene" class="ve-scene" data-paper="false">
      <object
        id="scene"
        type="image/svg+xml"
        data="tensor-cube.svg"
        aria-label="Коэффициенты и последовательное вычисление запроса BERT-mini"
      ></object>
      <div data-player></div>
    </main>
    <script type="module">
      import { attachProjection } from './controls.mjs';
      const root = document.getElementById('ve-scene');
      window.galleryReady = attachProjection(root, root.querySelector('#scene'));
    </script>
  </body>
</html>
