<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Почему 4 × 5 = 20</title><script type="module">import '@visual-storytelling/core/style.css';</script></head>
<body class="ve-standalone"><main id="ve-scene" class="ve-scene" lang="ru" data-story>
<style>
#ve-scene .canvas text{font-size:26px}#ve-scene .canvas .title{font-size:34px}#ve-scene .canvas .number{font-size:34px}#ve-scene .canvas .small{font-size:20px}#ve-scene .canvas .tiny{font-size:17px}#ve-scene .caption{font-size:16px}#ve-scene .canvas .blue{color:var(--ve-blue)}#ve-scene .canvas .green{color:var(--ve-green)}#ve-scene .canvas .muted{color:var(--ve-muted)}
