<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Живые чернила</title>
  </head>
  <body class="ve-standalone">
    <main id="ink-fusion-scene" class="ve-scene" data-paper="false" lang="ru">
      <h1 class="ve-heading">Как формы соединяются</h1>
      <div class="fusion-equation sr-only" aria-live="polite">свет + тень → объём</div>
      <div class="fusion-cases"></div>
      <div class="fusion-stage ve-stage"></div>
      <details>
        <summary>Тексты и натяжение</summary>
        <div class="fusion-inputs"></div>
        <div class="fusion-tension"></div>
      </details>
      <div class="fusion-player" data-player></div>
      <p class="fusion-error" role="alert"></p>
    </main>
    <script type="module" src="scene.js"></script>
  </body>
</html>
