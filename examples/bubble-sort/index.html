<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Пузырьковая сортировка</title><script type="module">import '@visual-storytelling/core/style.css';</script></head><body class="ve-standalone"><main id="ve-scene" class="ve-scene"><style>
    #ve-scene .bs-heading { display: flex; align-items: baseline; justify-content: center; gap: 8px 20px; flex-wrap: wrap; }
    #ve-scene h3 { margin: 0; font-family: inherit; font-weight: 500; }
    #ve-scene .bs-figure { display: block; width: 100%; height: 226px; margin-top: 8px; overflow: visible; }
    #ve-scene .bs-figure text { fill: var(--ve-ink); font-family: inherit; font-weight: 400; }
    #ve-scene .bs-line { fill: none; stroke: var(--ve-ink); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    #ve-scene .bs-slot { stroke: var(--ve-ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    #ve-scene .bs-active-first { fill: var(--ve-blue-wash); stroke: var(--ve-blue); }
    #ve-scene .bs-active-second { fill: var(--ve-orange-wash); stroke: var(--ve-orange); }
    #ve-scene .bs-sorted-fill { fill: var(--ve-green-wash); stroke: var(--ve-green); }
    #ve-scene .bs-empty-fill { fill: none; }
    #ve-scene .bs-active-mark { stroke: var(--ve-purple); }
    #ve-scene .bs-sorted-mark { stroke: var(--ve-green); }
    #ve-scene .bs-counts { white-space: nowrap; }

#ve-scene .canvas text{font-size:21px}#ve-scene .canvas .text-small{font-size:16px}#ve-scene h1{margin-bottom:10px}#ve-scene [data-pass],#ve-scene [data-step]{font-size:15px;color:var(--ve-muted)}
</style>
  <div class="bs-heading">
    <h1>Пузырьковая сортировка</h1>
    <span class="text-small tabular-nums" data-pass>Проход 1 из 4</span>
  </div>
  <svg class="canvas bs-figure" role="img" aria-labelledby="bs-title bs-desc">
    <title id="bs-title">Сортировка пяти чисел по возрастанию</title>
    <desc id="bs-desc">Сравниваем соседей. Если левое число больше правого, меняем их местами.</desc>
  </svg>
  <div class="sr-only" aria-live="polite" aria-atomic="true" data-detail></div>
  <div data-player></div>
<span class="sr-only" data-counts></span></main><script type="module" src="scene.js"></script></body></html>
