<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>Motion review fixture</title>
  <style>
    body {
      font: 18px system-ui;
      background: #faf8f1;
      margin: 32px;
    }
    button {
      font: inherit;
      padding: 10px 18px;
    }
    .stage {
      position: relative;
      width: 560px;
      height: 220px;
      margin-top: 24px;
      border: 1px solid #bbc7c4;
    }
    #card {
      position: absolute;
      left: 20px;
      top: 45px;
      width: 110px;
      height: 90px;
      display: grid;
      place-items: center;
      background: #438b7b;
      color: white;
      border-radius: 15px;
      transition: transform 600ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .open #card {
      transform: translateX(340px);
    }
    #status {
      min-height: 28px;
    }
  </style>
  <h1>Moving card</h1>
  <button id="toggle">Move card</button
  ><button id="reset">Reset</button>
  <p id="status">Ready</p>
  <div class="stage"><div id="card">Card</div></div>
  <script>
    const stage = document.querySelector('.stage'),
      card = document.querySelector('#card'),
      status = document.querySelector('#status');
    let runs = 0;
    const fault = new URL(location.href).searchParams.get('fault') === '1';
    document.querySelector('#toggle').onclick = () => {
      runs++;
      stage.classList.toggle('open');
      status.textContent = 'Moving';
      if (fault) {
        setTimeout(() => {
          const until = performance.now() + 140;
          while (performance.now() < until) {}
        }, 120);
        setTimeout(() => {
          card.style.opacity = '0';
          requestAnimationFrame(() => requestAnimationFrame(() => (card.style.opacity = '1')));
        }, 340);
        if (runs > 1)
          setTimeout(() => {
            card.style.transform = 'translateX(220px)';
            setTimeout(() => (card.style.transform = ''), 80);
          }, 180);
      }
      setTimeout(() => (status.textContent = 'Done'), 700);
    };
    document.querySelector('#reset').onclick = () => {
      stage.classList.remove('open');
      runs = 0;
      status.textContent = 'Ready';
    };
  </script>
</html>
