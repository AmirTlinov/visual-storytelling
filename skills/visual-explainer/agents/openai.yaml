interface:
  display_name: "Наглядные объяснения"
  short_description: "Схемы, интерактивные разборы и рисованные рассказы"
  default_prompt: "Выстрой живое объяснение от знакомой задачи к новым понятиям. Покажи причину, действие и результат на тех же объектах; дай исследовать условия и обсудить текущий кадр в чате. Проверь промежуточные состояния. Озвучку подключай по желанию пользователя через доступный провайдер."
policy:
  allow_implicit_invocation: true
